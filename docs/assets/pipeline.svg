<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Virtual try-on request pipeline">
  <rect width="900" height="470" rx="10" fill="#fbfbfd" stroke="#d8dee9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
    <text x="28" y="40" font-size="19" font-weight="600" fill="#11151c">One try-on request</text>
    <text x="28" y="62" font-size="13" fill="#6b7484">person photo + garment photo &#8594; one generated fitting, single pass</text>

    <!-- inputs -->
    <rect x="28" y="92" width="150" height="86" rx="8" fill="#eef2fb" stroke="#c3cee4"/>
    <text x="103" y="122" font-size="13" font-weight="600" fill="#22304a" text-anchor="middle">person photo</text>
    <text x="103" y="142" font-size="11" fill="#6b7484" text-anchor="middle">their own pose,</text>
    <text x="103" y="157" font-size="11" fill="#6b7484" text-anchor="middle">framing, background</text>

    <rect x="28" y="196" width="150" height="86" rx="8" fill="#eef2fb" stroke="#c3cee4"/>
    <text x="103" y="226" font-size="13" font-weight="600" fill="#22304a" text-anchor="middle">garment photo</text>
    <text x="103" y="246" font-size="11" fill="#6b7484" text-anchor="middle">shot alone,</text>
    <text x="103" y="261" font-size="11" fill="#6b7484" text-anchor="middle">no model</text>

    <!-- pass 1 + 2: VLM -->
    <rect x="222" y="92" width="196" height="190" rx="8" fill="#fff" stroke="#d8dee9"/>
    <text x="320" y="118" font-size="13" font-weight="600" fill="#11151c" text-anchor="middle">1&#8202;+&#8202;2 &#183; read both</text>
    <text x="320" y="138" font-size="11" fill="#6b7484" text-anchor="middle">vision-language model</text>
    <line x1="242" y1="150" x2="398" y2="150" stroke="#e6eaf0"/>
    <text x="242" y="171" font-size="11" fill="#3d4757">garment &#8594; type, drape,</text>
    <text x="242" y="187" font-size="11" fill="#3d4757">fabric, metal, length</text>
    <text x="242" y="212" font-size="11" fill="#3d4757">person &#8594; pose, framing,</text>
    <text x="242" y="228" font-size="11" fill="#3d4757">setting</text>
    <text x="242" y="256" font-size="10" fill="#8a93a3">app/vision.py</text>
    <text x="242" y="270" font-size="10" fill="#8a93a3">pipeline/garments.py</text>

    <!-- pass 3: anatomy -->
    <rect x="462" y="92" width="176" height="190" rx="8" fill="#fff" stroke="#d8dee9"/>
    <text x="550" y="118" font-size="13" font-weight="600" fill="#11151c" text-anchor="middle">3 &#183; fix the anatomy</text>
    <text x="550" y="138" font-size="11" fill="#6b7484" text-anchor="middle">prompt assembly</text>
    <line x1="482" y1="150" x2="618" y2="150" stroke="#e6eaf0"/>
    <text x="482" y="171" font-size="11" fill="#3d4757">hands, arms, eyes, face</text>
    <text x="482" y="187" font-size="11" fill="#3d4757">appended verbatim</text>
    <text x="482" y="212" font-size="11" fill="#b4531a">encoder ignores</text>
    <text x="482" y="228" font-size="11" fill="#b4531a">negation &#8594; crop the</text>
    <text x="482" y="244" font-size="11" fill="#b4531a">reference instead</text>
    <text x="482" y="270" font-size="10" fill="#8a93a3">app/prompts.py</text>

    <!-- pass 4: render -->
    <rect x="682" y="92" width="190" height="190" rx="8" fill="#f2f7f1" stroke="#c2d8c0"/>
    <text x="777" y="118" font-size="13" font-weight="600" fill="#1d3a1c" text-anchor="middle">4 &#183; render once</text>
    <text x="777" y="138" font-size="11" fill="#5c6d5b" text-anchor="middle">FLUX.2 klein 9B + LoRA</text>
    <line x1="702" y1="150" x2="852" y2="150" stroke="#dbe7da"/>
    <text x="702" y="171" font-size="11" fill="#33452f">5 steps &#183; 0.75 MP</text>
    <text x="702" y="187" font-size="11" fill="#33452f">768 &#215; 1008 &#183; seed 42</text>
    <text x="702" y="212" font-size="11" fill="#33452f">no refinement pass,</text>
    <text x="702" y="228" font-size="11" fill="#33452f">no second sampler</text>
    <text x="702" y="256" font-size="20" font-weight="600" fill="#2f6a2b">~9.4 s</text>

    <!-- arrows -->
    <g stroke="#9aa4b5" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M178 135 H214"/><path d="M178 239 H214"/>
      <path d="M418 187 H454"/><path d="M638 187 H674"/>
    </g>
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa4b5"/></marker></defs>

    <!-- service band -->
    <rect x="28" y="318" width="844" height="120" rx="8" fill="#fff" stroke="#d8dee9"/>
    <text x="48" y="344" font-size="13" font-weight="600" fill="#11151c">The service around it</text>
    <g font-size="11" fill="#3d4757">
      <rect x="48" y="358" width="150" height="60" rx="6" fill="#f7f8fb" stroke="#e3e8ef"/>
      <text x="123" y="380" text-anchor="middle" font-weight="600" fill="#22304a">FastAPI</text>
      <text x="123" y="398" text-anchor="middle">/v1/tryon &#183; jobs</text>
      <text x="123" y="412" text-anchor="middle" fill="#8a93a3">app/main.py</text>

      <rect x="216" y="358" width="150" height="60" rx="6" fill="#f7f8fb" stroke="#e3e8ef"/>
      <text x="291" y="380" text-anchor="middle" font-weight="600" fill="#22304a">ComfyUI backend</text>
      <text x="291" y="398" text-anchor="middle">spawned + supervised</text>
      <text x="291" y="412" text-anchor="middle" fill="#8a93a3">app/comfy_client.py</text>

      <rect x="384" y="358" width="150" height="60" rx="6" fill="#f7f8fb" stroke="#e3e8ef"/>
      <text x="459" y="380" text-anchor="middle" font-weight="600" fill="#22304a">batch pipeline</text>
      <text x="459" y="398" text-anchor="middle">matrix &#183; catalogue</text>
      <text x="459" y="412" text-anchor="middle" fill="#8a93a3">pipeline/</text>

      <rect x="552" y="358" width="150" height="60" rx="6" fill="#f7f8fb" stroke="#e3e8ef"/>
      <text x="627" y="380" text-anchor="middle" font-weight="600" fill="#22304a">VLM QA harness</text>
      <text x="627" y="398" text-anchor="middle">grades anatomy</text>
      <text x="627" y="412" text-anchor="middle" fill="#8a93a3">app/qa.py</text>

      <rect x="720" y="358" width="132" height="60" rx="6" fill="#f7f8fb" stroke="#e3e8ef"/>
      <text x="786" y="380" text-anchor="middle" font-weight="600" fill="#22304a">reporting</text>
      <text x="786" y="398" text-anchor="middle">gallery &#183; benchmark</text>
      <text x="786" y="412" text-anchor="middle" fill="#8a93a3">reporting/</text>
    </g>
    <text x="28" y="460" font-size="10" fill="#8a93a3">/readyz gates on all four model files being loadable, not just the port being open.</text>
  </g>
</svg>
